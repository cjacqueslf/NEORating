name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Verify dependencies
        run: python -m pip check
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build portable package
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File packaging\build_portable.ps1
      - name: Verify packaged Digest2 calculation
        shell: powershell
        run: |
          $process = Start-Process `
            -FilePath "dist\NEORating-0.1.0-portable\NEORating.exe" `
            -ArgumentList "--verify-package" `
            -PassThru `
            -Wait
          if ($process.ExitCode -ne 0) {
            throw "Package verification failed with exit code $($process.ExitCode)."
          }
